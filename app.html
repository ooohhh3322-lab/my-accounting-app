<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人記帳與儲蓄 App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold tracking-wide">💡 個人記帳與儲蓄</h1>
      <span id="current-month-label" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-medium"></span>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-md w-full mx-auto p-4 space-y-4 mb-16 flex-grow">

    <!-- 財務總覽卡片 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 grid grid-cols-3 gap-2 text-center">
      <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-100">
        <p class="text-xs text-emerald-600 font-semibold mb-1">總收入</p>
        <p id="total-income" class="text-sm sm:text-base font-bold text-emerald-700">$0</p>
      </div>
      <div class="bg-rose-50 p-2.5 rounded-xl border border-rose-100">
        <p class="text-xs text-rose-600 font-semibold mb-1">總支出</p>
        <p id="total-expense" class="text-sm sm:text-base font-bold text-rose-700">$0</p>
      </div>
      <div class="bg-indigo-50 p-2.5 rounded-xl border border-indigo-100">
        <p class="text-xs text-indigo-600 font-semibold mb-1">淨儲蓄</p>
        <p id="net-savings" class="text-sm sm:text-base font-bold text-indigo-700">$0</p>
      </div>
    </section>

    <!-- 頁籤切換 -->
    <div class="flex bg-slate-200 p-1 rounded-xl">
      <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition">記帳表單</button>
      <button onclick="switchTab('chart')" id="tab-chart" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition">圖表分析</button>
      <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 transition">收支明細</button>
    </div>

    <!-- 區塊 1：記帳表單 -->
    <div id="section-record" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-base font-bold text-slate-700">新增收支紀錄</h2>
      
      <!-- 類型切換 -->
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="type-expense" onclick="setTxType('expense')" class="py-2.5 rounded-xl font-bold text-sm bg-rose-600 text-white shadow-sm transition">支出 🔴</button>
        <button type="button" id="type-income" onclick="setTxType('income')" class="py-2.5 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 transition">收入 🟢</button>
      </div>

      <!-- 金額輸入 -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (NT$)</label>
        <input type="number" id="tx-amount" inputmode="numeric" placeholder="請輸入金額" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-lg">
      </div>

      <!-- 分類選擇 -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">類別</label>
        <select id="tx-category" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
          <!-- 動態載入 -->
        </select>
      </div>

      <!-- 日期 -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
        <input type="date" id="tx-date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
      </div>

      <!-- 備註 -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">備註 (選填)</label>
        <input type="text" id="tx-note" placeholder="例如：午餐雞腿飯、計程車..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <button onclick="addTransaction()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">儲存紀錄</button>
    </div>

    <!-- 區塊 2：圖表分析 -->
    <div id="section-chart" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-6 hidden">
      <div>
        <h2 class="text-base font-bold text-slate-700 mb-2">支出類別佔比</h2>
        <div class="relative w-full h-64 flex justify-center items-center">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>
      <hr class="border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-700 mb-2">收支結餘比例</h2>
        <div class="relative w-full h-64 flex justify-center items-center">
          <canvas id="balanceChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 區塊
